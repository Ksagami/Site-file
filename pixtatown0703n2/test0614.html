<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistem - 誠実運送</title>
    <style>
        /* リセット */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* ロゴ中央配置 */
        .logo-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .logo {
            width: 140vw;
            max-width: 2688px;
            height: auto;
            filter: drop-shadow(7px 7px 3px rgba(0, 0, 0, 0.3));
        }

        /* オレンジグラデーション背景 */
        .orange-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            opacity: 1;
        }

        .orange-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 下部アニメーションエリア */
        .bottom-animation {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 275px;
            z-index: 5;
            background-color: white;
        }

        /* 街並みスクロール */
        .town-container {
            width: 100%;
            overflow: hidden;
        }

        .town-scroll {
            display: flex;
            animation: scroll-right 60s linear infinite;
            position: absolute;
            bottom: 20px;
            width: auto;
        }

        .newtown {
            width: auto;
            height: 70vh;
            max-height: 756px;
            flex-shrink: 0;
        }

        @keyframes scroll-right {
            0% {
                transform: translateX(-50%);
            }
            100% {
                transform: translateX(0);
            }
        }

        /* 4トントラック */
        .truck-container {
            position: absolute;
            bottom: -420px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
        }

        .truck {
            width: 60vw !important;
            max-width: 1152px !important;
            height: auto !important;
        }

        @keyframes wheel-spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(-360deg);
            }
        }

        #tire1 polyline {
            transform-origin: 772.25px 680.38px;
            animation: wheel-spin 3s linear infinite;
        }

        #tire2 polyline {
            transform-origin: 1025.96px 680.38px;
            animation: wheel-spin 3s linear infinite;
        }

        #tire3 polyline {
            transform-origin: 1095.87px 680.38px;
            animation: wheel-spin 3s linear infinite;
        }

        /* ===== 鳥の羽ばたきアニメーション（群れ） ===== */
        .bird-container {
            position: fixed;
            transform: translateY(-50%);
            z-index: 102;
            display: none;
            animation: bird-float var(--float-dur) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: var(--opacity);
        }

        .bird-svg {
            width: 150px;
            height: auto;
            transform: scale(var(--scale));
        }

        .fether-left, .fether-right, .face {
            fill: #000;
        }

        .fether-left {
            transform-origin: 665px 393px;
            animation: wing-flap-left var(--flap-dur) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        .fether-right {
            transform-origin: 650px 393px;
            animation: wing-flap-right var(--flap-dur) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        /* 各鳥の個別設定 */
        .bird-container:nth-child(1) {
            top: 35%;
            right: 25%;
            --delay: 0s;
            --flap-dur: 0.3s;
            --float-dur: 4s;
            --float-dist: 20px;
            --scale: 1;
            --opacity: 1;
        }

        .bird-container:nth-child(2) {
            top: 45%;
            right: 35%;
            --delay: 0.7s;
            --flap-dur: 0.35s;
            --float-dur: 4.5s;
            --float-dist: 25px;
            --scale: 0.8;
            --opacity: 0.9;
        }

        .bird-container:nth-child(3) {
            top: 55%;
            right: 15%;
            --delay: 0.3s;
            --flap-dur: 0.28s;
            --float-dur: 3.8s;
            --float-dist: 18px;
            --scale: 0.65;
            --opacity: 0.8;
        }

        .bird-container:nth-child(4) {
            top: 40%;
            right: 40%;
            --delay: 1s;
            --flap-dur: 0.32s;
            --float-dur: 4.2s;
            --float-dist: 22px;
            --scale: 0.85;
            --opacity: 0.95;
        }

        .bird-container:nth-child(5) {
            top: 50%;
            right: 28%;
            --delay: 0.5s;
            --flap-dur: 0.38s;
            --float-dur: 5s;
            --float-dist: 30px;
            --scale: 0.7;
            --opacity: 0.85;
        }

        /* 浮遊アニメーション */
        @keyframes bird-float {
            0%, 100% {
                transform: translateY(-50%) translateY(0px);
            }
            50% {
                transform: translateY(-50%) translateY(calc(var(--float-dist) * -1));
            }
        }

        /* 羽ばたきアニメーション */
        @keyframes wing-flap-left {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(-20deg);
            }
        }

        @keyframes wing-flap-right {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(20deg);
            }
        }

        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .logo { width: 90vw; }
            .truck { 
                width: 80vw !important;
                bottom: -280px;
            }
            .newtown { height: 60vh; }
            .bottom-animation { height: 250px; }
            .bird-container {
                right: calc(var(--mobile-right) - 10%) !important;
            }
            .bird-svg {
                width: 100px;
            }
        }
    </style>
</head>
