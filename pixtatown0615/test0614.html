<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistem - 誠実運送</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
            font-family: Arial, sans-serif;
        }

        /* ロゴ中央配置 */
        .logo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .logo {
            width: 2400px;
            height: auto;
            filter: drop-shadow(7px 7px 3px rgba(0, 0, 0, 0.3));
        }

        /* 下部アニメーションエリア */
        .bottom-animation {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            z-index: 5;
        }

        /* 4トントラック（中央固定） */
        .truck-container {
            position: absolute;
            bottom: -310px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
        }

        .truck {
            width: 850px !important;
            height: auto !important;
        }

        /* 新しい街並み */
        .town-container {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 300px;
            z-index: 6;
            overflow: visible;
        }

        .newtown {
            width: 100%;
            height: auto;
            position: absolute;
            bottom: 20px;
        }

        /* アニメーション定義 */
        @keyframes wheel-spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(-360deg);
            }
        }

        /* タイヤの回転中心設定 */
        #tire1 polyline, #tire2 polyline, #tire3 polyline {
            transform-origin: 772.25px 680.38px;
        }

        #tire2 polyline {
            transform-origin: 1025.96px 680.38px;
        }

        #tire3 polyline {
            transform-origin: 1095.87px 680.38px;
        }

        /* タイヤスポークの色変更 */
        #tire1 polyline, #tire2 polyline, #tire3 polyline {
            stroke: #035e87 !important;
        }

        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .logo {
                width: 90vw;
            }
            
            .truck {
                width: 200px;
            }
            
            .bottom-animation {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- ロゴ -->
    <div class="logo-container">
        <img src="img/logo.svg" alt="Logistem" class="logo">
    </div>

            </svg>
        </div>
        
        <!-- 新しい街並み -->
        <div class="town-container">
            <img src="img/newtown0614.svg" alt="街並み" class="newtown">
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // タイヤ回転アニメーション（最初から開始・左回り）
            const tire1 = document.querySelector('#tire1');
            const tire2 = document.querySelector('#tire2');
            const tire3 = document.querySelector('#tire3');
            
            if (tire1) {
                const spokes1 = tire1.querySelectorAll('polyline');
                spokes1.forEach(spoke => spoke.style.animation = 'wheel-spin 3s linear infinite');
            }
            
            if (tire2) {
                const spokes2 = tire2.querySelectorAll('polyline');
                spokes2.forEach(spoke => spoke.style.animation = 'wheel-spin 3s linear infinite');
            }
            
            if (tire3) {
                const spokes3 = tire3.querySelectorAll('polyline');
                spokes3.forEach(spoke => spoke.style.animation = 'wheel-spin 3s linear infinite');
            }
        });
    </script>
</body>
</html>
