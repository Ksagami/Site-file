    <script>
        // 4秒後に鳥を表示
        setTimeout(() => {
            document.querySelectorAll('.bird-container').forEach(bird => {
                bird.style.display = 'block';
            });
        }, 4000);
        
        // 5.5秒後にアニメーション開始
        setTimeout(() => {
            // 背景をオレンジに（2秒かけて）
            document.querySelector('.orange-background').classList.add('show');
            
            // ロゴをモノクロ化（2秒かけて）
            document.querySelector('.logo-container').classList.add('grayscale');
            
            // キャッチコピーを表示開始（2秒かけて滲み出し）
            document.querySelector('.catch-container').classList.add('show');
            
            // 7.5秒後（5.5秒 + 2秒後）
            setTimeout(() => {
                // ロゴのopacityを下げる（2秒かけて0.15へ）
//                document.querySelector('.logo-container').classList.add('fade');
                
                // キャッチコピーにドロップシャドウ追加
                document.querySelector('.catch-container').classList.add('shadow');
                
                // 9.5秒後（7.5秒 + 2秒後）- スライドショーへの移行
                setTimeout(() => {
                    // ロゴとキャッチを完全にフェードアウト
//                    document.querySelector('.logo-container').classList.add('hide');
                    document.querySelector('.catch-container').classList.add('hide');
                    
                    // スライドショーを表示
                    document.querySelector('.slideshow-container').classList.add('show');
                    
                    // 街並みとトラックを縮小
                    document.querySelector('.bottom-animation').classList.add('shrink');
                    
                    // スライドショー開始
                    startSlideshow();
                }, 2000);
            }, 2000);
        }, 5500);
        
        // スライドショー機能
        let slideIndex = 0;
        function startSlideshow() {
            setInterval(() => {
                const slides = document.querySelectorAll('.slide');
                slides[slideIndex].classList.remove('active');
                slideIndex = (slideIndex + 1) % slides.length;
                slides[slideIndex].classList.add('active');
            }, 3000); // 3秒ごとにスライド切り替え
        }
    </script>
