<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistem - グラデーションテスト</title>
    <style>
        /* リセット */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* ロゴ中央配置 */
        .logo-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .logo {
            width: 140vw;
            max-width: 2688px;  /* 1920px × 1.4 */
            height: auto;
            filter: drop-shadow(7px 7px 3px rgba(0, 0, 0, 0.3));
        }

        /* オレンジグラデーション背景 */
        .orange-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            opacity: 1; /* 最初から表示 */
        }

        .orange-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 下部アニメーションエリア（街並み用） */
        .bottom-animation {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 275px;
            z-index: 5;
            background-color: white;
        }

        /* 街並みスクロール */
        .town-container {
            width: 100%;
            overflow: hidden;
        }

        .town-scroll {
            display: flex;
            animation: scroll-right 60s linear infinite;
            position: absolute;
            bottom: 20px;
            width: auto;
        }

        .newtown {
            width: auto;
            height: 70vh;
            max-height: 756px;  /* 1080px × 0.7 */
            flex-shrink: 0;
        }

        /* 街並み右スクロールアニメーション */
        @keyframes scroll-right {
            0% {
                transform: translateX(-50%);
            }
            100% {
                transform: translateX(0);
            }
        }

        /* 4トントラック（中央固定） */
        .truck-container {
            position: absolute;
            bottom: -420px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
        }

        .truck {
            width: 60vw !important;
            max-width: 1152px !important;  /* 1920px × 0.6 */
            height: auto !important;
        }

        /* タイヤ回転アニメーション */
        @keyframes wheel-spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(-360deg);
            }
        }

        /* タイヤの回転中心設定 */
        #tire1 polyline {
            transform-origin: 772.25px 680.38px;
            animation: wheel-spin 3s linear infinite;
        }

        #tire2 polyline {
            transform-origin: 1025.96px 680.38px;
            animation: wheel-spin 3s linear infinite;
        }

        #tire3 polyline {
            transform-origin: 1095.87px 680.38px;
            animation: wheel-spin 3s linear infinite;
        }
		
	
		/* タブレット以下 */
@media (max-width: 768px) {
    .logo { width: 90vw; }
    .truck { 
        width: 80vw !important;
        bottom: -280px;
    }
    .newtown { height: 60vh; }
}

/* 4K以上 */
@media (min-width: 2560px) {
    .truck-container {
        bottom: -550px;
    }
}
    </style>
